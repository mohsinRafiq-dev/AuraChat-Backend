# AuraChat API — Nginx reverse proxy for the Node backend on EC2.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/aurachat
#   sudo ln -sf /etc/nginx/sites-available/aurachat /etc/nginx/sites-enabled/aurachat
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue a certificate (certbot rewrites this file in place):
#   sudo certbot --nginx -d api.yourdomain.com
#
# TLS is not optional here. Vercel serves the frontend over HTTPS, and browsers
# block plain-HTTP requests from an HTTPS page as mixed content — the app would
# fail to make a single API call.

upstream aurachat_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Required for the WebSocket upgrade: maps the incoming Upgrade header to the
# value Nginx should send upstream, and to "close" for ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;   # <-- change this

    # Certbot replaces this block with a 301 to HTTPS once a cert is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yourdomain.com;   # <-- change this

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # Uploads are capped at 256kb by express.json(); keep Nginx a little above it
    # so oversized bodies are rejected by the app with a JSON error, not by Nginx
    # with an HTML page the frontend cannot parse.
    client_max_body_size 1m;

    # Socket.IO connections are long-lived. The default 60s read timeout would
    # cut idle sockets; the app's own 25s heartbeat keeps them alive well inside
    # this window.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    access_log /var/log/nginx/aurachat.access.log;
    error_log  /var/log/nginx/aurachat.error.log;

    # Socket.IO — must come before the catch-all so the upgrade headers apply.
    location /socket.io/ {
        proxy_pass http://aurachat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://aurachat_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
